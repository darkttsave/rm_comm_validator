<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RM Communication Validator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-top">
                <h1>RM Communication Validator</h1>
                <div class="runtime-badge" id="runtime-badge">
                    <span id="runtime-mode">Normal</span>
                </div>
            </div>
            <div class="header-info">
                <span id="runtime-display">00:00:00</span>
            </div>
        </header>

        <!-- Control Panel -->
        <section class="control-panel">
            <!-- Data source selection -->
            <div class="source-panel">
                <h2 class="panel-title">数据源 Data Source</h2>
                <div class="source-buttons">
                    <button id="btn-src-demo" class="btn src-btn" data-src="demo">Demo</button>
                    <button id="btn-src-replay" class="btn src-btn" data-src="replay">Replay</button>
                    <button id="btn-src-live" class="btn src-btn" data-src="live">Live</button>
                </div>
            </div>

            <!-- Current session -->
            <div class="session-panel">
                <h2 class="panel-title">当前会话 Current Session</h2>
                <div id="session-detail" class="session-detail">
                    <div class="session-info">
                        <div id="session-text">就绪 Ready</div>
                        <div id="session-backend" class="session-backend" hidden></div>
                    </div>
                    <div id="session-status" class="session-status-idle">● Idle</div>
                </div>
                <div class="session-actions">
                    <button id="btn-start" class="btn btn-start">Start</button>
                    <button id="btn-stop" class="btn btn-stop" disabled>Stop</button>
                </div>
            </div>

            <!-- Replay config -->
            <div id="config-replay" class="config-panel" hidden>
                <h3>选择 JSONL 日志文件</h3>
                <select id="replay-file-select" class="replay-select">
                    <option value="">-- 选择日志文件 --</option>
                </select>
            </div>

            <!-- Live config -->
            <div id="config-live" class="config-panel" hidden>
                <div class="config-row">
                    <label>Transport:</label>
                    <select id="transport-select" class="config-select">
                        <option value="">-- Loading --</option>
                    </select>
                </div>

                <div class="config-row">
                    <label>Protocol:</label>
                    <select id="protocol-select" class="config-select">
                        <option value="">-- Select Transport first --</option>
                    </select>
                </div>

                <div class="config-row">
                    <label>Endpoint:</label>
                    <div class="endpoint-row">
                        <select id="endpoint-select" class="config-select">
                            <option value="">-- Select Protocol first --</option>
                        </select>
                        <button id="btn-refresh-endpoint" class="btn btn-secondary btn-small">Refresh</button>
                    </div>
                </div>

                <div id="baudrate-row" class="config-row" hidden>
                    <label>Baudrate:</label>
                    <input type="number" id="serial-baudrate" value="9600" min="300" max="115200" step="1">
                </div>

                <div id="live-error" class="live-error" hidden></div>
            </div>

            <!-- Options -->
            <div class="options-row">
                <label class="error-injection">
                    <input type="checkbox" id="chk-error-injection">
                    Demo 错误注入
                </label>
                <label class="log-mode-selector">
                    日志记录:
                    <select id="log-mode-select" class="log-mode-select">
                        <option value="none">不记录</option>
                        <option value="errors" selected>仅异常</option>
                        <option value="all">全部</option>
                    </select>
                </label>
            </div>
            <div id="log-status" class="log-status"></div>
        </section>

        <!-- Statistics -->
        <section class="statistics">
            <h2>统计信息</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">总帧数</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
                <div class="stat-item stat-valid">
                    <span class="stat-label">有效</span>
                    <span class="stat-value" id="stat-valid">0</span>
                </div>
                <div class="stat-item stat-invalid">
                    <span class="stat-label">无效</span>
                    <span class="stat-value" id="stat-invalid">0</span>
                </div>
                <div class="stat-item stat-unknown">
                    <span class="stat-label">未知</span>
                    <span class="stat-value" id="stat-unknown">0</span>
                </div>
            </div>
            <div class="rates" id="rates-container">
                <!-- Frame rates will be inserted here -->
            </div>
        </section>

        <!-- Messages -->
        <section class="messages">
            <div id="messages-container">
                <p class="no-data">等待数据...</p>
            </div>
        </section>

        <!-- Recent Events -->
        <section class="events">
            <h2>近期事件</h2>
            <div id="events-container" class="events-list">
                <p class="no-data">无事件</p>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
